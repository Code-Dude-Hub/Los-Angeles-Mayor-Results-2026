name: Update election data and publish site

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'trigger.html'
      - '.github/workflows/publish.yml'
      - 'assets/**'

permissions:
  contents: write
  pages: write
  id-token: write

# Serialize runs. Scheduled checks never request a Pages deployment.
concurrency:
  group: la-mayor-pages
  cancel-in-progress: false

jobs:
  update_and_publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      # The 10-minute schedule updates the repository's JSON, not the Pages site.
      # The website reads the current JSON directly from the repository.
      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve and validate official LA County JSON
        if: github.event_name != 'push'
        run: python scripts/fetch_results.py

      - name: Commit saved vote data and last-checked time
        if: github.event_name != 'push'
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- data/results.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/results.json
            git commit -m "Save LA mayor election report [skip ci]"
            git push
          fi

      # The JSON is fetched live; Pages deployment is only for manual runs or site changes.
      - name: Prepare static website
        if: github.event_name != 'schedule'
        shell: bash
        run: |
          mkdir -p _site/data _site/assets
          cp index.html _site/index.html
          cp trigger.html _site/trigger.html
          cp data/results.json _site/data/results.json
          if [[ -d assets ]]; then cp -R assets/. _site/assets/; fi

      - name: Configure GitHub Pages
        if: github.event_name != 'schedule'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publish Pages website
        if: github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
